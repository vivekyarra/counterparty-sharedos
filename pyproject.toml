[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "counterparty-sharedos"
version = "0.3.0"
description = "Active trust, verification, and best-execution flywheel for SharedNet agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.setuptools.packages.find]
include = ["counterparty*"]
exclude = ["tests*", "sharedos*", "scripts*", "reports*", "data*"]
